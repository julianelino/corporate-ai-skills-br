name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  portable-structure:
    name: portable structure (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os != 'Windows'
        run: bash scripts/validate.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/validate.ps1

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run check
