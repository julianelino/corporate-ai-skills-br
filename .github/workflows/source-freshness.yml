name: source-freshness-review

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-and-request-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Runs real HTTP checks (scripts/check-source-freshness.mjs) — never part of `npm run check` /
      # Core, deliberately not committed back: this workflow only reads and reports, it never pushes
      # a change to SOURCE_REGISTRY.yaml or any knowledge content on its own.
      - name: Check source freshness
        id: check
        run: node scripts/check-source-freshness.mjs | tee /tmp/freshness-check.txt
      - name: Build impact report
        run: node scripts/report-source-impact.mjs | tee /tmp/freshness-report.txt
      - name: Open review issue if any source needs attention
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const check = fs.readFileSync('/tmp/freshness-check.txt', 'utf8');
            const report = fs.readFileSync('/tmp/freshness-report.txt', 'utf8');
            const needsReview = /CHANGED_UNREVIEWED|UNREACHABLE|STALE/.test(check);
            if (!needsReview) {
              console.log('No source flagged CHANGED_UNREVIEWED/UNREACHABLE/STALE this run; skipping issue.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[KNOWLEDGE UPDATE] Source freshness review needed',
              body: [
                'Automated check (scripts/check-source-freshness.mjs) found one or more sources that need a human look.',
                'This workflow never updates knowledge content or approves anything — it only detects and reports.',
                '',
                '## Check results', '```', check.trim(), '```',
                '## Impact report', '```', report.trim(), '```',
                '',
                'Next: a qualified reviewer confirms whether the source content actually changed materially, updates the affected sources.md/references if needed, and sets last_verified on the source (never automatically).',
              ].join('\n'),
              labels: ['knowledge-review'],
            });
