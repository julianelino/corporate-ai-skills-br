name: source-freshness-review

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  request-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open controlled source-review issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[KNOWLEDGE UPDATE] Scheduled authoritative-source review',
              body: 'Review Planalto, MTE, TST, eSocial, FGTS, Receita, SPED, CFC, CPC and BACEN for changes. Do not silently update critical knowledge; document affected skills, sources, tests and human review.',
              labels: ['knowledge-review']
            })
